# Site Build Settings

# Jekyll-paginate-v2 configuration
#  pagination:
#   enabled: true
#   per_page: 5
#   permalink: '/page/:num/'
#   title: ':title - page :num of :max'
#   limit: 0
#   sort_field: 'date'
#   sort_reverse: true

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag, jekyll-polyglot]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           'Alicia Paz'
description:	       ''
author:              'Alicia Paz'

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml

# Site URL (needed for absolute_url under the GitHub Actions build)
url:                 "https://www.aliciapaz.me"
baseurl:             ""

# Polyglot (i18n)
languages:           ["es", "en"]
default_lang:        "es"
exclude_from_localization: ["assets", "CNAME", "favicon.ico", "rss-feed.xml", "robots.txt"]
parallel_localization: false
