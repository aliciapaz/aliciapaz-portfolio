# Build settings
markdown:            kramdown
permalink:           /:title
plugins:             [jekyll-sitemap, jekyll-seo-tag, jekyll-polyglot]

title:               'Alicia Paz'
description:         ''
author:              'Alicia Paz'

# Site URL (needed for absolute_url under the GitHub Actions build)
url:                 "https://www.aliciapaz.me"
baseurl:             ""

collections:
  notes:
    output: false

exclude:             ["README.md", "LICENSE", "Gemfile", "Gemfile.lock", ".tool-versions", "vendor"]

# Polyglot (i18n)
languages:           ["es", "en"]
default_lang:        "es"
exclude_from_localization: ["assets", "CNAME", "favicon.ico", "robots.txt"]
parallel_localization: false
