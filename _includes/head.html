<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/assets/css/main.css">
  {% seo %}
  {% comment %} Bilingual hreflang alternates {% endcomment %}
  {% assign neutral_url = page.url | remove_first: '/en' %}
  {% for lang in site.languages %}
    {% if lang == site.default_lang %}
      <link rel="alternate" hreflang="{{ lang }}" href="{{ neutral_url | absolute_url }}" />
    {% else %}
      {% capture lang_url %}/{{ lang }}{{ neutral_url }}{% endcapture %}
      <link rel="alternate" hreflang="{{ lang }}" {% static_href %}href="{{ lang_url | absolute_url }}"{% endstatic_href %} />
    {% endif %}
  {% endfor %}
</head>
